name: Tests

# Pull requests are tested on their merge commit; branch pushes outside a PR
# are not. Listing push for every branch as well ran the whole workflow twice
# for each push to a PR branch.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Download dependencies
      run: make mod-download
    - name: Run tests
      run: make test

  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: e2e/go.mod
    - name: Run e2e tests
      run: make e2e-test
